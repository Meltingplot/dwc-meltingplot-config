name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dwc36_ref:
        description: 'DuetWebControl ref for the 3.6 package (default: v3.6-dev)'
        required: false
        default: ''
      dwc37_ref:
        description: 'DuetWebControl ref for the 3.7 package (default: v3.7-dev)'
        required: false
        default: ''

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov --cov-report=term-missing
        env:
          PYTHONPATH: dsf

  frontend-tests:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest tests/frontend/*.test.js tests/frontend/core/ --verbose

      - name: Integration tests
        run: npx jest tests/frontend/integration/ --verbose

  build:
    name: Build DWC ${{ matrix.dwc_major }} package
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          # DWC 3.6: Vue 2.7 / Vuetify 2.7, vue-cli + webpack. Node 18 is proven.
          - gen: "36"
            dwc_major: "3.6"
            default_ref: v3.6-dev
            node: "18"
          # DWC 3.7: Vue 3.5 / Vuetify 4, Vite 8 + vue-tsc — needs Node 22+.
          # The type check runs inside build-plugin-pkg and fails this leg on
          # template type errors.
          - gen: "37"
            dwc_major: "3.7"
            default_ref: v3.7-dev
            node: "22"

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve DuetWebControl ref
        id: dwc
        run: |
          if [ "${{ matrix.gen }}" = "36" ]; then
            ref="${{ github.event.inputs.dwc36_ref }}"
          else
            ref="${{ github.event.inputs.dwc37_ref }}"
          fi
          echo "ref=${ref:-${{ matrix.default_ref }}}" >> "$GITHUB_OUTPUT"

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ steps.dwc.outputs.ref }}
          path: DuetWebControl

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install DWC dependencies
        working-directory: DuetWebControl
        run: npm install

      - name: Compute version from git
        working-directory: plugin
        run: node scripts/version.js --write

      - name: Build plugin package
        working-directory: plugin
        env:
          DWC36_DIR: ${{ github.workspace }}/DuetWebControl
          DWC37_DIR: ${{ github.workspace }}/DuetWebControl
        run: node scripts/build.js ${{ matrix.gen }}

      - name: Verify build output
        working-directory: plugin
        env:
          EXPECTED_DWC_VERSION: ${{ matrix.dwc_major }}
          GEN: ${{ matrix.gen }}
        run: |
          zip=$(ls dist/MeltingplotConfig-*-dwc${GEN}.zip)
          echo "Built $zip"
          unzip -l "$zip"

          cat > /tmp/verify-manifest.mjs <<'JS'
          // A green build does not mean the page loads: DWC 3.7 takes the
          // resource list from manifest.dwcFiles, and an empty list makes it
          // register the plugin as SBC-only and never load the UI.
          let raw = "";
          process.stdin.on("data", (chunk) => { raw += chunk; });
          process.stdin.on("end", () => {
            const manifest = JSON.parse(raw);
            const fail = (message) => { console.error(`::error::${message}`); process.exitCode = 1; };
            if (manifest.dwcVersion !== process.env.EXPECTED_DWC_VERSION) {
              fail(`dwcVersion is ${manifest.dwcVersion}, expected ${process.env.EXPECTED_DWC_VERSION}`);
            }
            if (!(manifest.dwcFiles || []).some((file) => file.endsWith(".js"))) {
              fail("dwcFiles carries no JS resource — DWC would treat this as an SBC-only plugin");
            }
            if (!(manifest.dsfFiles || []).includes("meltingplot-config-daemon.py")) {
              fail("dsfFiles is missing the daemon");
            }
            console.log(`dwcVersion=${manifest.dwcVersion}`);
            console.log(`dwcFiles=${(manifest.dwcFiles || []).join(", ")}`);
            console.log(`dsfFiles=${(manifest.dsfFiles || []).join(", ")}`);
          });
          JS
          unzip -p "$zip" plugin.json | node /tmp/verify-manifest.mjs

          unzip -l "$zip" | grep -qE 'dwc/js/MeltingplotConfig.*\.js' \
            || { echo "::error::No compiled JS bundle in the package"; exit 1; }
          unzip -l "$zip" | grep -q 'dsf/meltingplot-config-daemon.py' \
            || { echo "::error::The Python backend is missing from the package"; exit 1; }

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MeltingplotConfig-plugin-dwc${{ matrix.gen }}
          path: plugin/dist/MeltingplotConfig-*-dwc${{ matrix.gen }}.zip
          retention-days: 30
